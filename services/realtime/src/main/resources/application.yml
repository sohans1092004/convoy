server:
  port: 8080
  shutdown: graceful
spring:
  application.name: realtime
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/convoy}
    username: realtime
    password: ${DB_PASSWORD}
    hikari.maximum-pool-size: ${DB_POOL_SIZE:8}
    hikari.schema: realtime
  flyway:
    schemas: realtime
    default-schema: realtime
    locations: classpath:db/platform,classpath:db/migration
  data.redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    timeout: 2s # a Redis outage must not stall the SQS consumer: fall back to local delivery fast
  threads.virtual.enabled: true
  mvc.async.request-timeout: -1
logging.structured.format.console: ecs
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
convoy:
  service-name: realtime
  identity-url: ${IDENTITY_URL:http://identity:8080}
  client-id: realtime
  client-secret: ${CLIENT_SECRET_REALTIME:}
  issuers:
    convoy-gateway: ${GATEWAY_JWKS:http://gateway:8080/.well-known/jwks.json}
    convoy-identity: ${IDENTITY_JWKS:http://identity:8080/.well-known/jwks.json}
  aws:
    endpoint: ${AWS_ENDPOINT:}
    region: ${AWS_REGION:ap-south-1}
realtime:
  instance: ${REALTIME_INSTANCE:realtime}
  pool-url: ${POOL_URL:http://pool:8080}
  # realtime-recovery.md: heartbeat 15 s, bounded queue 256 per connection, re-validate access every 30 s.
  heartbeat: ${REALTIME_HEARTBEAT:15s}
  queue-capacity: ${REALTIME_QUEUE_CAPACITY:256}
  revalidate: ${REALTIME_REVALIDATE:30s}
