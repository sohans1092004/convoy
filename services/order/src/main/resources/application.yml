server:
  port: 8080
  shutdown: graceful
spring:
  application.name: order
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/convoy}
    username: order
    password: ${DB_PASSWORD}
    hikari.maximum-pool-size: ${DB_POOL_SIZE:8}
    hikari.schema: order
  flyway:
    schemas: order
    default-schema: order
    locations: classpath:db/platform,classpath:db/migration
  threads.virtual.enabled: true
logging.structured.format.console: ecs
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
convoy:
  privacy: # P5.D (docs/privacy/retention.md): orders and bookings are transaction records, disputes are kept for claims
    tables:
      - {table: orders, column: buyer_id, action: PSEUDONYMISE, category: orders}
      - {table: payment_replica, column: buyer_id, action: PSEUDONYMISE, category: orders}
      - {table: contact_consents, column: buyer_id, action: PSEUDONYMISE, category: orders}
      - {table: contact_releases, column: buyer_id, action: PSEUDONYMISE, category: orders}
      - {table: disputes, column: buyer_id, action: PSEUDONYMISE, category: disputes}
      - {table: disputes, column: proposed_by, action: PSEUDONYMISE, category: disputes}
      # an evidence note is the file name the person typed: cleared (before the general actor_id rule, which would no longer match)
      - {table: dispute_history, column: actor_id, where: "actor_id = ? and action = 'EVIDENCE_ADDED'", action: PSEUDONYMISE, category: disputes, clear: [note]}
      - {table: dispute_history, column: actor_id, action: PSEUDONYMISE, category: disputes}
      - {table: dispute_evidence, column: uploader_id, action: PSEUDONYMISE, category: disputes, clear: [file_name]}
    retention:
      # disputes: 2 years after resolution (Consumer Protection Act 2019 s.69); legal review flagged. A dispute with evidence
      # waits until Evidence.purgeExpired has deleted its S3 files and then their rows (no orphaned files).
      - category: disputes
        days: 730
        sql: >-
          with d as (select id from disputes where resolved_at < :cutoff
                     and not exists (select 1 from dispute_evidence e where e.dispute_id = disputes.id)),
          h as (delete from dispute_history where dispute_id in (select id from d))
          delete from disputes where id in (select id from d)
      # orders and bookings: 8 years (Companies Act 2013 s.128(5)); one statement, orders and price_snapshots reference each other.
      # An order whose disputes still have evidence waits for Evidence.purgeExpired too.
      - category: orders
        days: 2922
        sql: >-
          with o as (select id from orders where created_at < :cutoff and not exists (select 1 from dispute_evidence e join disputes x on x.id = e.dispute_id
                     where x.order_id = orders.id)),
          d as (select id from disputes where order_id in (select id from o)),
          h as (delete from dispute_history where dispute_id in (select id from d)),
          dd as (delete from disputes where id in (select id from d)),
          r as (delete from contact_releases where order_id in (select id from o)),
          c as (delete from contact_consents where order_id in (select id from o)),
          s as (delete from saga_steps where order_id in (select id from o)),
          b as (delete from bookings where order_id in (select id from o)),
          p as (delete from price_snapshots where order_id in (select id from o))
          delete from orders where id in (select id from o)
  service-name: order
  identity-url: ${IDENTITY_URL:http://identity:8080}
  client-id: order
  client-secret: ${CLIENT_SECRET_ORDER:}
  issuers:
    convoy-gateway: ${GATEWAY_JWKS:http://gateway:8080/.well-known/jwks.json}
    convoy-identity: ${IDENTITY_JWKS:http://identity:8080/.well-known/jwks.json}
  aws:
    endpoint: ${AWS_ENDPOINT:}
    region: ${AWS_REGION:ap-south-1}
order:
  sweeper-interval: ${ORDER_SWEEPER_INTERVAL:5s}
  identity-url: ${IDENTITY_URL:http://identity:8080}
  evidence:
    bucket: ${EVIDENCE_BUCKET:convoy-dispute-evidence}
    # LocalStack: pre-signed URLs must name the address the browser reaches (the published port), not the in-network host.
    public-endpoint: ${EVIDENCE_PUBLIC_ENDPOINT:}
  dealer-confirm-window: P2D
  saga-step-timeout: PT10M
