server:
  port: 8080
  shutdown: graceful
spring:
  cloud.discovery.client.simple.instances.realtime:
    - uri: ${REALTIME_1_URL:http://realtime-1:8080}
    - uri: ${REALTIME_2_URL:http://realtime-2:8080}
  application.name: gateway
  # Fail fast on a dead upstream (a stopped container leaves DNS): the stream route's retry then picks the other instance.
  cloud.gateway.server.webflux.httpclient.connect-timeout: 1000
  cloud.gateway.server.webflux.httpclient.pool.max-idle-time: 15s # below Tomcat's 20 s keep-alive (stale-connection 500s)
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: 6379
    timeout: 500ms
logging.structured.format.console: ecs
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
  health.redis.enabled: false
gateway:
  key-dir: ${GATEWAY_KEY_DIR:./build/gateway-keys}
  client-id: gateway
  client-secret: ${CLIENT_SECRET_GATEWAY}
  token-ttl: 120s
  session-cache-ttl: 25s # auth-contract.md: <= 30 s; 5 s margin so a revocation (AZ-T6) is refused within 30 s incl. polling
  # Fail fast (P2.5.B): requests in flight per route before refusing with 503 + Retry-After (override per route id).
  route-concurrency:
    default: ${GATEWAY_ROUTE_CONCURRENCY:256}
  services:
    identity: ${IDENTITY_URL:http://identity:8080}
    catalog: ${CATALOG_URL:http://catalog:8080}
    pool: ${POOL_URL:http://pool:8080}
    dealer: ${DEALER_URL:http://dealer:8080}
    quote: ${QUOTE_URL:http://quote:8080}
    order: ${ORDER_URL:http://order:8080}
    payment: ${PAYMENT_URL:http://payment:8080}
    notification: ${NOTIFICATION_URL:http://notification:8080}
    audit: ${AUDIT_URL:http://audit:8080}
    realtime: ${REALTIME_URL:lb://realtime}
  limits:
    otp: { max: "${RATE_OTP_MAX:10}", window: 10m }
    join: { max: "${RATE_JOIN_MAX:20}", window: 1m }
