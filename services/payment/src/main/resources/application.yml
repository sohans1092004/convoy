server:
  port: 8080
  shutdown: graceful
spring:
  application.name: payment
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/convoy}
    username: payment
    password: ${DB_PASSWORD}
    hikari.maximum-pool-size: ${DB_POOL_SIZE:8}
  flyway:
    schemas: payment
    default-schema: payment
    locations: classpath:db/platform,classpath:db/migration
  threads.virtual.enabled: true
logging.structured.format.console: ecs
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
convoy:
  service-name: payment
  identity-url: ${IDENTITY_URL:http://identity:8080}
  client-id: payment
  client-secret: ${CLIENT_SECRET_PAYMENT:}
  issuers:
    convoy-gateway: ${GATEWAY_JWKS:http://gateway:8080/.well-known/jwks.json}
    convoy-identity: ${IDENTITY_JWKS:http://identity:8080/.well-known/jwks.json}
  aws:
    endpoint: ${AWS_ENDPOINT:}
    region: ${AWS_REGION:ap-south-1}
