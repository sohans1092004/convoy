server:
  port: 8080
  shutdown: graceful
spring:
  application.name: payment
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/convoy}
    username: payment
    password: ${DB_PASSWORD}
    hikari.maximum-pool-size: ${DB_POOL_SIZE:8}
    hikari.schema: payment
  flyway:
    schemas: payment
    default-schema: payment
    locations: classpath:db/platform,classpath:db/migration
  threads.virtual.enabled: true
logging.structured.format.console: ecs
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
convoy:
  privacy: # P5.D (docs/privacy/retention.md): deposits, refunds and the ledger are kept under a pseudonym
    tables:
      - {table: payments, column: buyer_id, action: PSEUDONYMISE, category: payments, rewrite: [deposit_key]}
      - {table: refunds, column: requested_by, action: PSEUDONYMISE, category: payments}
      - {table: refunds, column: approved_by, action: PSEUDONYMISE, category: payments}
      - {table: admin_audit, column: actor, action: PSEUDONYMISE, category: staff-actions}
    retention:
      # payments, refunds, ledger: 8 years (Companies Act 2013 s.128(5); CGST Act s.36 is 72 months); legal review flagged.
      # Whole journal entries go together, so the ledger stays balanced.
      - {category: payments, days: 2922, sql: "delete from journal_lines where entry_id in (select e.id from journal_entries e join payments p on p.id = e.payment_id where p.created_at < :cutoff)"}
      - {category: payments, days: 2922, sql: "delete from journal_entries where payment_id in (select id from payments where created_at < :cutoff)"}
      - {category: payments, days: 2922, sql: "delete from reconciliation_mismatches where payment_id in (select id from payments where created_at < :cutoff)"}
      - {category: payments, days: 2922, sql: "delete from refunds where payment_id in (select id from payments where created_at < :cutoff)"}
      - {category: payments, days: 2922, sql: "delete from payments where created_at < :cutoff"}
  service-name: payment
  identity-url: ${IDENTITY_URL:http://identity:8080}
  client-id: payment
  client-secret: ${CLIENT_SECRET_PAYMENT:}
  issuers:
    convoy-gateway: ${GATEWAY_JWKS:http://gateway:8080/.well-known/jwks.json}
    convoy-identity: ${IDENTITY_JWKS:http://identity:8080/.well-known/jwks.json}
  aws:
    endpoint: ${AWS_ENDPOINT:}
    region: ${AWS_REGION:ap-south-1}
  public-paths:
    - /actuator/health
    - /actuator/health/**
    - /actuator/prometheus
    - /v3/api-docs/**
    - /webhooks/razorpay
payment:
  razorpay-base-url: ${RAZORPAY_BASE_URL:http://razorpay-fake:9090}
  razorpay-key-id: ${RAZORPAY_KEY_ID:rzp_test_fake}
  razorpay-key-secret: ${RAZORPAY_KEY_SECRET}
  razorpay-webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}
  deposit-amount-paise: ${DEPOSIT_AMOUNT_PAISE:99900}
  # AMENDMENT-007 (Q-041): flat Rs 2,500 per delivered booking, a dealer receivable (J-FEE), never from a buyer deposit. 0 = off.
  success-fee-paise: ${SUCCESS_FEE_PAISE:250000}
  # refund.yaml: retry at 1 min, 5 min, 30 min, 2 h, 12 h, then REFUND_STUCK alarm + admin queue.
  refund-retry-schedule: ${REFUND_RETRY_SCHEDULE:1m,5m,30m,2h,12h}
  # PAY-T05: unpaid deposits are voided after this (a later capture is refunded, PAY-T10).
  void-unpaid-after: ${VOID_UNPAID_AFTER:24h}
  # deposit-contract.md §1.6: no payment.captured 15 min after PENDING is a STUCK_WEBHOOK (reconciliation).
  stuck-webhook-after: ${STUCK_WEBHOOK_AFTER:15m}
  # deposit-contract.md §4: nightly at 02:00 IST.
  reconciliation-cron: "${RECONCILIATION_CRON:0 30 20 * * *}"
