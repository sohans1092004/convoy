server:
  port: 8080
  shutdown: graceful
spring:
  application.name: dealer
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/convoy}
    username: dealer
    password: ${DB_PASSWORD}
    hikari.maximum-pool-size: ${DB_POOL_SIZE:8}
    hikari.schema: dealer
  flyway:
    schemas: dealer
    default-schema: dealer
    locations: classpath:db/platform,classpath:db/migration
  threads.virtual.enabled: true
logging.structured.format.console: ecs
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
convoy:
  privacy: # P5.D (docs/privacy/retention.md): reliability counts stay; review text goes
    tables:
      - {table: reviews, column: buyer_id, action: PSEUDONYMISE, category: reviews, clear: [body]}
      - {table: delivered_bookings, column: buyer_id, action: PSEUDONYMISE, category: dealer-reliability}
      - {table: dealership_audit, column: actor, action: PSEUDONYMISE, category: staff-actions}
      - {table: dealerships, column: registered_by, action: PSEUDONYMISE, category: staff-actions}
      - {table: dealerships, column: verified_by, action: PSEUDONYMISE, category: staff-actions}
  service-name: dealer
  identity-url: ${IDENTITY_URL:http://identity:8080}
  client-id: dealer
  client-secret: ${CLIENT_SECRET_DEALER:}
  issuers:
    convoy-gateway: ${GATEWAY_JWKS:http://gateway:8080/.well-known/jwks.json}
    convoy-identity: ${IDENTITY_JWKS:http://identity:8080/.well-known/jwks.json}
  aws:
    endpoint: ${AWS_ENDPOINT:}
    region: ${AWS_REGION:ap-south-1}
dealer:
  # Demo seed (P4.0): synthetic dealerships only when DEMO=true and the seed file is mounted (never in migrations).
  demo: ${DEMO:false}
  demo-seed-file: ${DEMO_SEED_DEALERSHIPS:}
