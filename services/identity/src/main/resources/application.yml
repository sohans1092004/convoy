server:
  port: 8080
  shutdown: graceful
spring:
  application.name: identity
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/convoy}
    username: identity
    password: ${DB_PASSWORD}
    hikari.maximum-pool-size: ${DB_POOL_SIZE:12}
    hikari.schema: identity
  flyway:
    schemas: identity
    default-schema: identity
    locations: classpath:db/platform,classpath:db/migration
  mail: # same keys as identity (AMENDMENT-011): Mailpit locally; the SES SMTP interface on AWS (credentials from Secrets Manager, P6)
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
  threads.virtual.enabled: true
logging.structured.format.console: ecs
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
convoy:
  service-name: identity
  identity-url: http://localhost:8080
  issuers:
    convoy-gateway: ${GATEWAY_JWKS:http://gateway:8080/.well-known/jwks.json}
    convoy-identity: http://localhost:8080/.well-known/jwks.json
  public-paths:
    - /actuator/health
    - /actuator/health/**
    - /actuator/prometheus
    - /v3/api-docs/**
    - /.well-known/jwks.json
    - /internal/oauth/token
  aws:
    endpoint: ${AWS_ENDPOINT:}
    region: ${AWS_REGION:ap-south-1}
identity:
  data-key: ${IDENTITY_DATA_KEY}
  privacy: # P5.D: who must send an export part and confirm an erasure (docs/privacy/retention.md)
    services: catalog,pool,dealer,quote,order,payment,notification
    export-bucket: ${EXPORT_BUCKET:convoy-data-exports}
    public-endpoint: ${EXPORT_PUBLIC_ENDPOINT:}
  mail-from: ${MAIL_FROM:no-reply@convoy.test}
  otp-minutes: 10
  session-days: 30
  seed-users-file: ${SEED_USERS_FILE:}
  # P6.B public demo (lite): visitor scenarios on, simulated dealer users from this file; email sign-in only with SES production access
  demo-scenarios: ${DEMO_SCENARIOS:false}
  demo-bots-file: ${DEMO_BOTS_FILE:}
  demo-dealer-url: ${DEALER_URL:http://dealer:8080}
  email-sign-in: ${EMAIL_SIGN_IN:true}
  invite-hours: 72
  web-url: ${WEB_URL:http://localhost:3000}
  passkeys:
    rp-id: ${PASSKEY_RP_ID:localhost}
    rp-name: Convoy
    origins: ${PASSKEY_ORIGINS:http://localhost:3000}
    challenge-minutes: 5
  clients:
    gateway: { secret: "${CLIENT_SECRET_GATEWAY}", scopes: { identity: [sessions:validate] } }
    pool:
      secret: "${CLIENT_SECRET_POOL}"
      scopes: { payment: [deposits:create], quote: [rounds:summary], dealer: [eligibility:read], order: [resolution:read], catalog: [models:read], identity: [privacy:write] }
    order:
      secret: "${CLIENT_SECRET_ORDER}"
      scopes: { identity: [contacts:read, privacy:write] } # P4.B: a buyer's contact, only for a released booking
    notification:
      secret: "${CLIENT_SECRET_NOTIFICATION}"
      scopes: { identity: [contacts:read, privacy:write] } # P5.A: the recipient's email, read at send time
    # P5.D: every service holding personal data sends its export part (E165) and confirms erasure (E017)
    catalog: { secret: "${CLIENT_SECRET_CATALOG}", scopes: { identity: [privacy:write] } }
    dealer: { secret: "${CLIENT_SECRET_DEALER}", scopes: { identity: [privacy:write] } }
    quote: { secret: "${CLIENT_SECRET_QUOTE}", scopes: { identity: [privacy:write] } }
    payment: { secret: "${CLIENT_SECRET_PAYMENT}", scopes: { identity: [privacy:write] } }
    demo-bots: { secret: "${CLIENT_SECRET_DEMO_BOTS:}", scopes: { identity: [demo:sessions] } } # P6.B simulated dealers; absent without a secret
    realtime:
      secret: "${CLIENT_SECRET_REALTIME}"
      scopes: { pool: [pools:access], identity: [sessions:check] }
