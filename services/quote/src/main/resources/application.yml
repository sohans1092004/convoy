server:
  port: 8080
  shutdown: graceful
spring:
  application.name: quote
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/convoy}
    username: quote
    password: ${DB_PASSWORD}
    hikari.maximum-pool-size: ${DB_POOL_SIZE:8}
    hikari.schema: quote
  flyway:
    schemas: quote
    default-schema: quote
    locations: classpath:db/platform,classpath:db/migration
  threads.virtual.enabled: true
logging.structured.format.console: ecs
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
convoy:
  privacy: # P5.D (docs/privacy/retention.md)
    tables:
      - {table: member_replica, column: buyer_id, action: PSEUDONYMISE, category: pool-participation}
      - {table: quotes, column: created_by, action: PSEUDONYMISE, category: staff-actions}
      - {table: quote_versions, column: committed_by, action: PSEUDONYMISE, category: staff-actions}
      - {table: audit_trail, column: actor, action: PSEUDONYMISE, category: staff-actions}
  service-name: quote
  identity-url: ${IDENTITY_URL:http://identity:8080}
  client-id: quote
  client-secret: ${CLIENT_SECRET_QUOTE:}
  issuers:
    convoy-gateway: ${GATEWAY_JWKS:http://gateway:8080/.well-known/jwks.json}
    convoy-identity: ${IDENTITY_JWKS:http://identity:8080/.well-known/jwks.json}
  aws:
    endpoint: ${AWS_ENDPOINT:}
    region: ${AWS_REGION:ap-south-1}
