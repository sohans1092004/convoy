name: ci

# P1 CI: path-filtered JVM builds per module, the Node/web checks, and the full end-to-end journey
# against docker compose on every PR. The spec checks stay in spec.yml.
on:
  push:
    branches: [main, "p*/**"] # phase branches get CI before their PR opens
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.pick.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: ['libs/**', 'build.gradle.kts', 'settings.gradle.kts', 'gradle/**', 'spec-tools/vectors/**', 'docs/architecture/**', 'docs/rules/state-machines/**']
            identity: ['services/identity/**']
            gateway: ['services/gateway/**']
            catalog: ['services/catalog/**', 'docs/data/**']
            dealer: ['services/dealer/**']
            pool: ['services/pool/**']
            quote: ['services/quote/**']
            order: ['services/order/**']
            payment: ['services/payment/**']
      - id: pick
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          all='[":libs:price-engine",":libs:platform",":services:identity",":services:gateway",":services:catalog",":services:dealer",":services:pool",":services:quote",":services:order",":services:payment",":services:realtime"]'
          if echo "$CHANGES" | grep -q shared || [ "${{ github.event_name }}" = push ]; then echo "modules=$all" >> "$GITHUB_OUTPUT"; exit 0; fi
          mods=$(echo "$CHANGES" | python3 -c 'import json,sys; print(json.dumps([":services:"+m for m in json.load(sys.stdin) if m!="shared"]))')
          echo "modules=$mods" >> "$GITHUB_OUTPUT"

  jvm:
    needs: changes
    if: needs.changes.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Test ${{ matrix.module }} (Testcontainers)
        run: ./gradlew ${{ matrix.module }}:test --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ strategy.job-index }}
          path: '**/build/test-results/test/*.xml'

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Generated code is current
        run: |
          python3 tools/gen_contracts.py --check
          python3 tools/gen_catalog_seed.py --check
          (cd web && node scripts/gen-api.mjs --offline) && git diff --exit-code web/lib/api
      - name: TypeScript price engine matches the vectors
        run: pnpm --filter @convoy/price-engine test && pnpm --filter @convoy/price-engine typecheck
      - name: Razorpay fake contract
        run: pnpm --filter @convoy/razorpay-fake test
      - name: Web unit tests
        run: pnpm --filter web test
      - name: Web typecheck, build, Storybook
        run: |
          pnpm --filter @convoy/web typecheck
          pnpm --filter @convoy/web build
          pnpm --filter @convoy/web build-storybook --quiet
      - name: Storybook page states (24) and visual regression (light/dark, 360 px/desktop)
        working-directory: web
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test -c playwright.storybook.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # On the first run (no committed baselines) this holds the Linux-rendered baselines to commit.
          name: visual-baselines
          path: |
            web/e2e-stories/__screenshots__
            web/playwright-report-stories

  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - name: Build service jars
        run: ./gradlew bootJar --console=plain
      - name: Start the stack (demo durations, Razorpay fake)
        run: |
          bash scripts/dev-env.sh
          docker compose up -d --build
          bash scripts/wait-stack.sh
      - name: Schema isolation
        run: docker compose exec -T postgres psql -U convoy_admin -d convoy -q < deploy/local/checks/schema-isolation.sql
      - name: Playwright journey (360 px + desktop) with axe
        run: |
          pnpm install --frozen-lockfile
          cd web && npx playwright install --with-deps chromium && npx playwright test
      - name: Route JS budgets (baseline + 10 %, Q-037)
        working-directory: web
        run: node scripts/js-budgets.mjs
      - name: Lighthouse (mobile, simulated 4G) on discover, model and pool pages
        working-directory: web
        run: node scripts/lighthouse.mjs
      - name: Realtime across two instances (fan-out, FLUSHALL, Redis down, stop and kill)
        run: node tools/realtime/two-instances.mjs
      - name: Runner memory headroom and container memory
        if: always()
        run: |
          free -m
          docker stats --no-stream --format '{{.Name}} {{.MemUsage}}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
            reports/p2/lighthouse.json
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
