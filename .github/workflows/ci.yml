name: ci

# P1 CI: path-filtered JVM builds per module, the Node/web checks, and the full end-to-end journey
# against docker compose on every PR. The spec checks stay in spec.yml.
on:
  push:
    branches: [main, "p*/**"] # phase branches get CI before their PR opens
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.pick.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: ['libs/**', 'build.gradle.kts', 'settings.gradle.kts', 'gradle/**', 'spec-tools/vectors/**', 'docs/architecture/**', 'docs/rules/state-machines/**']
            identity: ['services/identity/**']
            gateway: ['services/gateway/**']
            catalog: ['services/catalog/**', 'docs/data/**']
            dealer: ['services/dealer/**']
            pool: ['services/pool/**']
            quote: ['services/quote/**']
            order: ['services/order/**']
            payment: ['services/payment/**']
            realtime: ['services/realtime/**']
      - id: pick
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          all='[":libs:price-engine",":libs:platform",":services:identity",":services:gateway",":services:catalog",":services:dealer",":services:pool",":services:quote",":services:order",":services:payment",":services:realtime"]'
          # Only changed modules (P2.5.B); shared code or a push to main runs them all.
          if echo "$CHANGES" | grep -q shared || [ "${{ github.ref }}" = refs/heads/main ]; then echo "modules=$all" >> "$GITHUB_OUTPUT"; exit 0; fi
          mods=$(echo "$CHANGES" | python3 -c 'import json,sys; print(json.dumps([":services:"+m for m in json.load(sys.stdin) if m!="shared"]))')
          [ -n "$mods" ] || mods='[]'
          echo "modules=$mods" >> "$GITHUB_OUTPUT"

  jvm:
    needs: changes
    if: needs.changes.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Test ${{ matrix.module }} (Testcontainers; MF-1..MF-6 run nightly)
        run: ./gradlew ${{ matrix.module }}:test -PskipNightly --build-cache --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ strategy.job-index }}
          path: '**/build/test-results/test/*.xml'

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Generated code is current
        run: |
          python3 tools/gen_contracts.py --check
          python3 tools/gen_catalog_seed.py --check
          (cd web && node scripts/gen-api.mjs --offline) && git diff --exit-code web/lib/api
      - name: TypeScript price engine matches the vectors
        run: pnpm --filter @convoy/price-engine test && pnpm --filter @convoy/price-engine typecheck
      - name: Razorpay fake contract
        run: pnpm --filter @convoy/razorpay-fake test
      - name: Web unit tests
        run: pnpm --filter web test
      - name: Web typecheck
        run: pnpm --filter @convoy/web typecheck
      # Build, Storybook, visual regression, bundle budgets and Lighthouse run nightly (.github/workflows/nightly.yml).

  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - name: Build service jars
        run: ./gradlew bootJar --build-cache --console=plain
      - name: Build the images once and start the stack (demo durations, Razorpay fake)
        run: |
          bash scripts/dev-env.sh
          docker compose up -d --build
          bash scripts/wait-stack.sh
      - name: Schema isolation
        run: docker compose exec -T postgres psql -U convoy_admin -d convoy -q < deploy/local/checks/schema-isolation.sql
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: P1 journey (360 px) with axe; the desktop viewport and other browser suites run nightly
        run: |
          pnpm install --frozen-lockfile
          cd web && pnpm exec playwright install --with-deps chromium && pnpm exec playwright test e2e/journey.spec.ts --project=mobile-360
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
