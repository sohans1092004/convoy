name: deploy-lite

# Lite deploys run from the owner's laptop (scripts/deploy-lite.sh, docs/runbooks/lite-host.md), through Systems Manager
# with the owner's aws login session; the host has no inbound SSH. This workflow never runs on push; started by
# hand it stops at once and says where deploys happen.
on:
  workflow_dispatch:

permissions: {}

jobs:
  refuse:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "::error::lite deploys run from the owner's laptop: see docs/runbooks/lite-host.md"
          exit 1
