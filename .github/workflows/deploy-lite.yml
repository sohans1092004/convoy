name: deploy-lite

# Lite deploys run from the owner's laptop (scripts/deploy-lite.sh, docs/runbooks/lite-host.md): the host accepts SSH
# only from the owner's IP, and port 22 is never opened to GitHub runners. This workflow never runs on push; started by
# hand it stops at once and says where deploys happen.
on:
  workflow_dispatch:

permissions: {}

jobs:
  refuse:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "::error::lite deploys run from the owner's laptop: see docs/runbooks/lite-host.md"
          exit 1
