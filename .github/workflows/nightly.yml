name: nightly

# P2.5.B: the slow suites moved off the push/PR path (ci.yml). Runs nightly at 03:00 IST and on demand.
on:
  schedule:
    - cron: '30 21 * * *' # 21:30 UTC = 03:00 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  messaging-failures:
    name: MF-1..MF-6 (messaging failure tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Tagged "nightly" tests in platform, payment and realtime
        run: ./gradlew :libs:platform:test :services:payment:test :services:realtime:test -PonlyNightly --build-cache --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mf-test-results
          path: '**/build/test-results/test/*.xml'

  stories:
    name: Storybook states + visual regression (light/dark, 360 px/desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Web build and Storybook
        run: |
          pnpm --filter @convoy/web build
          pnpm --filter @convoy/web build-storybook --quiet
      - name: Page states (24) and visual regression
        working-directory: web
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test -c playwright.storybook.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-baselines
          path: |
            web/e2e-stories/__screenshots__
            web/playwright-report-stories

  browser:
    name: Both viewports, budgets, Lighthouse, realtime scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - name: Build service jars
        run: ./gradlew bootJar --build-cache --console=plain
      - name: Build the images once and start the stack
        run: |
          bash scripts/dev-env.sh
          docker compose up -d --build
          bash scripts/wait-stack.sh
      - name: All Playwright suites, 360 px + desktop (journey, page states, Hindi, passkeys)
        run: |
          pnpm install --frozen-lockfile
          cd web && pnpm exec playwright install --with-deps chromium && pnpm exec playwright test
      - name: Route JS budgets (baseline + 10 %, Q-037)
        working-directory: web
        run: node scripts/js-budgets.mjs
      - name: Lighthouse (mobile, simulated 4G) on discover, model and pool pages
        working-directory: web
        run: node scripts/lighthouse.mjs
      - name: Realtime across two instances (fan-out, FLUSHALL, Redis down, stop and kill)
        run: node tools/realtime/two-instances.mjs
      - name: Runner memory headroom and container memory
        if: always()
        run: |
          free -m
          docker stats --no-stream --format '{{.Name}} {{.MemUsage}}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-browser
          path: |
            web/playwright-report
            web/test-results
            reports/p2/lighthouse.json
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
