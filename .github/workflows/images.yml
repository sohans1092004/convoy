name: images

# P6.A: amd64 + arm64 images of every service, the web app and the simulated payment, pushed to GHCR.
# Each arch builds on a native runner and pushes by digest; a merge job makes the multi-arch index and writes
# images.env (IMAGE_<NAME>=ghcr.io/...@sha256:...), the only thing deploys read. Deploys never use tags.
on:
  push:
    branches: [main, "p6/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGES: identity gateway catalog dealer pool quote order payment realtime notification audit web razorpay-fake demo-bots

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew bootJar --build-cache --console=plain
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Build and push by digest
        run: |
          repo=ghcr.io/${GITHUB_REPOSITORY,,}
          mkdir -p digests
          for name in $IMAGES; do
            case $name in
              web) args="-f web/Dockerfile" ;;
              razorpay-fake) args="-f tools/razorpay-fake/Dockerfile" ;;
              demo-bots) args="-f tools/simulator/Dockerfile" ;;
              *) args="-f deploy/docker/service.Dockerfile --build-arg SERVICE=$name" ;;
            esac
            docker buildx build $args --platform linux/${{ matrix.arch }} \
              --label org.opencontainers.image.revision=$GITHUB_SHA \
              --output type=image,name=$repo/convoy-$name,push-by-digest=true,name-canonical=true,push=true \
              --metadata-file meta.json .
            jq -r '."containerimage.digest"' meta.json > digests/$name
          done
      - uses: actions/upload-artifact@v4
        with: { name: 'digests-${{ matrix.arch }}', path: digests }

  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: 'digests-*' }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Multi-arch index per image, digests recorded
        run: |
          repo=ghcr.io/${GITHUB_REPOSITORY,,}
          for name in $IMAGES; do
            # the sha tag is a label for people; images.env pins the index digest
            docker buildx imagetools create -t $repo/convoy-$name:$GITHUB_SHA \
              $repo/convoy-$name@$(cat digests-amd64/$name) $repo/convoy-$name@$(cat digests-arm64/$name)
            digest=$(docker buildx imagetools inspect $repo/convoy-$name:$GITHUB_SHA --format '{{json .Manifest}}' | jq -r .digest)
            echo "IMAGE_$(echo $name | tr a-z- A-Z_)=$repo/convoy-$name@$digest" >> images.env
          done
          cat images.env | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: 'images-${{ github.sha }}', path: images.env, retention-days: 90 }
