# Event catalogue (PLAN §4.3). Source of truth for docs/architecture/events/*.schema.json
# (generated by spec-tools/gen_event_schemas.py - do not edit the schemas by hand).
#
# Every event: exactly one owner (the only service that may write it to its outbox), listed consumers
# (real services from services.md), FIFO only where justified. audit consumes every event (PLAN §4.6).
# Payload field types: uuid | string | int | paise | timestamp | date | bool | object | enum(A|B) ; suffix [] = array ; suffix ? = nullable.
#
# Transport: one SNS topic per owner. Owners with FIFO events also have one SNS FIFO topic
# (<owner>-events.fifo, MessageGroupId = aggregate_id, content-based dedup OFF, MessageDeduplicationId = event_id).
# Each consumer has one SQS queue per topic (+ DLQ, maxReceiveCount 5) with an SNS filter policy on event_type.
# AMENDMENT-006: an SNS FIFO topic can deliver to SQS standard queues (AWS What's New, 2023-09-14,
# https://aws.amazon.com/about-aws/whats-new/2023/09/amazon-sns-fifo-topics-message-delivery-sqs-standard-queues/ , accessed 2026-10-24;
# standard subscribers get best-effort ordering and at-least-once delivery). Consumers that need pool order
# (quote, order, realtime, and payment for membership events) subscribe to pool-events.fifo with FIFO queues;
# notification and audit subscribe with standard queues and rely on inbox dedupe only (AMENDMENT-010, AMENDMENT-012 for audit).
envelope: events/envelope.schema.json
fifo_policy: "FIFO only where consumers must apply events in order per aggregate and cannot cheaply recompute: pool membership counts and pool/round lifecycle (MessageGroupId = pool_id). All consumers additionally check aggregate_version: gap -> park and retry, stale -> ignore and count, gap older than 5 min -> fetch owner snapshot (PLAN §4.3.3)."
events:
  # ---------------- identity
  - {name: UserRegistered, owner: identity, consumers: [notification, audit], aggregate: user, fifo: false, payload: {user_id: uuid, roles: "string[]", locale: "enum(en|hi)"}}
  - {name: SessionRevoked, owner: identity, consumers: [gateway, realtime, audit], aggregate: user, fifo: false, payload: {user_id: uuid, session_id_hash: string, reason: "enum(LOGOUT|ADMIN|STAFF_REVOKED|PASSWORD_RESET|ERASURE)"}}
