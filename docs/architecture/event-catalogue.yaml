# Subscription kinds (P2 step 0.4), one per (consumer, aggregate) pair above.
# Every consumer applies the stale rule: aggregate_version <= last applied for that aggregate -> ignore and count.
# FULL = the consumer receives every event type of the aggregate, so a version gap is real: park, retry, and after
# 5 min fetch the owner snapshot. PARTIAL = it cannot tell a gap from an event it does not receive: stale rule only
# (order within the aggregate comes from the FIFO queue for pool events). validate_spec.py checks FULL <=> every event.
# EVENTS (AMENDMENT-010 notification, AMENDMENT-012 audit) = every event is its own message and never overwrites state: inbox dedupe
# on event_id only, no stale rule, so an unordered standard queue (or a backlog replay) loses nothing.
subscriptions:
  - {consumer: audit, aggregate: user, kind: EVENTS}
  - {consumer: catalog, aggregate: user, kind: PARTIAL}
