# Baseline insurance ESTIMATE: comprehensive year-1 own damage (OD) + 3-year third party (TP) bundle for a new private car.
# Shown as "Estimate - insurer quotes vary"; a dealer-confirmed premium for the same cover always replaces it.
ruleset_version: "2026.10.24-p0"
label: ESTIMATE
formula: "premium = OD_1yr + TP_3yr + GST; OD_1yr = IDV x od_rate_bp; IDV = ex_showroom x (10000 - depreciation_bp) / 10000; GST = (OD + TP) x gst_bp. Each step rounded half up to the whole rupee."
idv_depreciation_bp: 500
idv_depreciation_evidence: ASSUMPTION
idv_depreciation_note: "5 % for vehicles not older than 6 months per the India Motor Tariff depreciation schedule as commonly applied by insurers; schedule not re-read from a primary source in P0."
od_rate_bp: 200
od_rate_evidence: ASSUMPTION
od_rate_note: "Own-damage premium is priced by each insurer (no single published tariff); 2.00 % of IDV is a placeholder chosen for comparability, not a market rate. It only matters when a dealer gives no insurance figure; ranking uses the dealer's own figure only when it declares exactly this baseline cover and is binding (AMENDMENT-004)."
gst_bp: 1800
gst_evidence: ASSUMPTION
gst_note: "18 % GST on motor insurance premium; not re-verified after the 2025 GST rate changes (which exempted individual life/health policies, not motor)."
tp_3yr_by_engine_cc:
  - {max_cc: 1000, premium_paise: 652100}     # Rs 6,521
  - {max_cc: 1500, premium_paise: 1064000}    # Rs 10,640
  - {max_cc: null, premium_paise: 2459600}    # Rs 24,596
tp_evidence: SECONDARY
tp_note: "Two 2026 insurer-aggregator pages agree on these 3-year figures; the IRDAI notification itself was not read. A different figure (Rs 9,435) for 1000-1500 cc circulates but no source was found for it."
tp_sources:
  - {title: "Paybima - How to buy new car insurance in 2026 (TP rate table)", url: "https://www.paybima.com/blog/car-insurance/how-to-buy-a-new-car-insurance-policy-in-india", accessed: "2026-10-24"}
  - {title: "Paybima - Cheapest car insurance plans 2026 (TP rate table)", url: "https://www.paybima.com/blog/motor-insurance/cheapest-car-insurance-plans-in-india-from-popular-car-insurers", accessed: "2026-10-24"}
ev_tp: UNVERIFIED
ev_tp_note: "Separate kW-based TP slabs exist for EVs but were not verified in P0; the engine refuses to estimate EV insurance (dealer must enter it) - error INSURANCE_ESTIMATE_UNAVAILABLE."
addons_policy: "Zero-depreciation, engine protect, RSA, return-to-invoice etc. are listed separately as optional add-ons and never part of the baseline."
