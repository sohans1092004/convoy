<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Convoy</title>
<style>
  :root { --bg: #f7f7f5; --fg: #1b1d1f; --primary: #0f5c4d; --primary-fg: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121416; --fg: #ecedee; --primary: #4fbfa5; --primary-fg: #08201b; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 28rem; padding: 1.5rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  button { font: inherit; font-weight: 600; color: var(--primary-fg); background: var(--primary); border: 0; border-radius: .5rem; padding: .6rem 1rem; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>You are offline</h1>
  <p>Convoy needs a connection to show prices, offers and deadlines, so nothing here is saved on this device. Deadlines keep running while you are offline.</p>
  <p lang="hi">आप ऑफ़लाइन हैं। समय-सीमाएँ चलती रहती हैं; कनेक्शन वापस आने पर फिर से कोशिश करें।</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
